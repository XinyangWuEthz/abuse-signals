name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Unit tests + the end-to-end regression gate: rules-layer precision and
      # classifier PR-AUC floors on a fixed-seed synthetic dataset. A change that
      # degrades detection quality fails this job.
      - run: pytest -q
